<?xml version="1.0" encoding="UTF-8"?>
<svg id="canvas" width="1600" height="1560" viewBox="0 0 1600 1560" xmlns="http://www.w3.org/2000/svg">
        <!-- Inlined (not just the <head> copy above) so this still applies
             when the <svg> element is extracted standalone into
             system-overview.svg — an external stylesheet doesn't travel
             with it. -->
        <style>
            text {
                font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
            }
        </style>
        <rect x="0" y="0" width="1600" height="1560" fill="#ffffff" />
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
                orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="#555" />
            </marker>
            <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
                orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="#0e9488" />
            </marker>
            <marker id="arrowDashAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
                orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="#c98a0f" />
            </marker>
        </defs>

        <!-- ============ ICON DEFINITIONS ============ -->
        <defs>
            <g id="icon-user">
                <circle cx="12" cy="8" r="4" stroke="white" stroke-width="1.8" fill="none" />
                <path d="M4,21 C4,15.5 8,13 12,13 C16,13 20,15.5 20,21" stroke="white" stroke-width="1.8" fill="none"
                    stroke-linecap="round" />
            </g>
            <g id="icon-shield">
                <path d="M12,3 L20,6.5 V11.5 C20,16.5 16.5,20 12,21.5 C7.5,20 4,16.5 4,11.5 V6.5 Z" stroke="white"
                    stroke-width="1.8" fill="none" stroke-linejoin="round" />
                <path d="M8.5,12 L11,14.5 L16,9" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
            </g>
            <g id="icon-server">
                <rect x="4" y="4" width="16" height="6" rx="1.4" stroke="white" stroke-width="1.7" fill="none" />
                <rect x="4" y="14" width="16" height="6" rx="1.4" stroke="white" stroke-width="1.7" fill="none" />
                <circle cx="7.3" cy="7" r="1" fill="white" />
                <circle cx="7.3" cy="17" r="1" fill="white" />
            </g>
            <g id="icon-db">
                <ellipse cx="12" cy="6" rx="7.5" ry="3" stroke="white" stroke-width="1.7" fill="none" />
                <path d="M4.5,6 V18 C4.5,19.7 7.9,21 12,21 C16.1,21 19.5,19.7 19.5,18 V6" stroke="white"
                    stroke-width="1.7" fill="none" />
                <path d="M4.5,12 C4.5,13.7 7.9,15 12,15 C16.1,15 19.5,13.7 19.5,12" stroke="white" stroke-width="1.7"
                    fill="none" />
            </g>
            <g id="icon-chart">
                <path d="M4,20 H20" stroke="white" stroke-width="1.7" stroke-linecap="round" />
                <rect x="6" y="13" width="3.2" height="7" rx="0.6" fill="white" />
                <rect x="10.4" y="8" width="3.2" height="12" rx="0.6" fill="white" />
                <rect x="14.8" y="4.5" width="3.2" height="15.5" rx="0.6" fill="white" />
            </g>
            <g id="icon-check">
                <circle cx="12" cy="12" r="8.5" stroke="white" stroke-width="1.7" fill="none" />
                <path d="M7.5,12.3 L10.3,15 L16.5,8.8" stroke="white" stroke-width="1.8" fill="none"
                    stroke-linecap="round" stroke-linejoin="round" />
            </g>
            <g id="icon-warn">
                <path d="M12,3.5 L21,19.5 H3 Z" stroke="white" stroke-width="1.7" fill="none" stroke-linejoin="round" />
                <path d="M12,10 V14.2" stroke="white" stroke-width="1.8" stroke-linecap="round" />
                <circle cx="12" cy="16.8" r="1" fill="white" />
            </g>
            <g id="icon-key">
                <circle cx="8" cy="15" r="4" stroke="white" stroke-width="1.8" fill="none" />
                <path d="M11,12 L20,3 M17,6 L19.5,8.5 M14.5,8.5 L16.5,10.5" stroke="white" stroke-width="1.8"
                    fill="none" stroke-linecap="round" stroke-linejoin="round" />
            </g>
        </defs>

        <!-- ============ MAIN SPINE ============ -->

        <!-- Client -->
        <rect x="635" y="94" width="376" height="103" rx="16" fill="#f1f1ef" stroke="#5a6b7a" stroke-width="1.5" />
        <rect x="663" y="115" width="60" height="60" rx="12" fill="#5a6b7a" />
        <use href="#icon-user" x="671" y="123" width="44" height="44" />
        <text x="745" y="153" font-size="24" font-weight="600" fill="#222">
            HTTP Client
        </text>

        <!-- Edge: Express App -->
        <rect x="564" y="329" width="517" height="132" rx="16" fill="#eef5fc" stroke="#2e73b8" stroke-width="1.5" />
        <rect x="592" y="360" width="60" height="60" rx="12" fill="#2e73b8" />
        <use href="#icon-shield" x="600" y="368" width="44" height="44" />
        <text x="674" y="385" font-size="24" font-weight="600" fill="#1c4c7a">
            Edge — Express App
        </text>
        <text x="674" y="410" font-size="16" fill="#3a6690">
            helmet security headers · JSON body parsing
        </text>
        <text x="674" y="432" font-size="16" fill="#3a6690">
            apiRateLimiter — 100 req/min per IP on every /v1 route
        </text>
        <text x="674" y="450" font-size="13" fill="#3a6690">
            Zod schema validation at the service boundary
        </text>

        <!-- Rejected-early callout -->
        <rect x="1130" y="195" width="430" height="115" rx="12" fill="#fdf3df" stroke="#c98a0f" stroke-width="1.3"
            stroke-dasharray="4,4" />
        <rect x="1150" y="213" width="34" height="34" rx="8" fill="#c98a0f" />
        <use href="#icon-warn" x="1155" y="218" width="24" height="24" />
        <text x="1196" y="231" font-size="15" font-weight="600" fill="#7a5308">
            Rejected before it reaches a service
        </text>
        <text x="1196" y="252" font-size="13" fill="#555">
            validation failed (400) · missing/invalid/expired token (401)
        </text>
        <text x="1196" y="270" font-size="13" fill="#555">
            not the resource owner, or not an admin (403)
        </text>
        <text x="1196" y="288" font-size="13" fill="#555">
            rate limit exceeded (429)
        </text>
        <path d="M1130,252 H1081 V405" stroke="#c98a0f" stroke-width="1.4" stroke-dasharray="3,4" fill="none"
            marker-end="url(#arrowDashAmber)" />

        <!-- Controllers / Services -->
        <rect x="541" y="592" width="564" height="132" rx="16" fill="#fdeee0" stroke="#ec7211" stroke-width="1.5" />
        <rect x="569" y="628" width="60" height="60" rx="12" fill="#ec7211" />
        <use href="#icon-server" x="577" y="636" width="44" height="44" />
        <text x="651" y="653" font-size="24" font-weight="600" fill="#a85510">
            Controllers → Services
        </text>
        <text x="651" y="681" font-size="16" fill="#c56313">
            Thin controllers: parse request → call one service → next(error)
        </text>
        <text x="651" y="703" font-size="13" fill="#c56313">
            auth middleware + requireRole('admin') gate specific routes only
        </text>

        <!-- spine arrows -->
        <line x1="823" y1="197" x2="823" y2="329" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)" />
        <line x1="823" y1="461" x2="823" y2="592" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)" />

        <!-- fan-out: three repositories, one per data-access concern -->
        <path d="M823,724 V775 H330 V856" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
        <path d="M823,724 V775 H780 V856" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
        <path d="M823,724 V775 H1230 V856" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />

        <!-- UserRepository -->
        <rect x="140" y="856" width="380" height="132" rx="16" fill="#fdeee0" stroke="#ec7211" stroke-width="1.5" />
        <rect x="164" y="892" width="56" height="56" rx="12" fill="#ec7211" />
        <use href="#icon-server" x="171" y="899" width="42" height="42" />
        <text x="238" y="917" font-size="19" font-weight="600" fill="#a85510">
            UserRepository
        </text>
        <text x="238" y="943" font-size="13" fill="#c56313">
            Parameterized SQL · unique-violation → 409
        </text>
        <text x="238" y="962" font-size="13" fill="#c56313">
            paginated listing for GET /v1/admin/users
        </text>

        <!-- CacheRepository -->
        <rect x="590" y="856" width="380" height="132" rx="16" fill="#fdeee0" stroke="#ec7211" stroke-width="1.5" />
        <rect x="614" y="892" width="56" height="56" rx="12" fill="#ec7211" />
        <use href="#icon-server" x="621" y="899" width="42" height="42" />
        <text x="688" y="917" font-size="19" font-weight="600" fill="#a85510">
            CacheRepository
        </text>
        <text x="688" y="943" font-size="13" fill="#c56313">
            Read-through profile cache, 1h TTL
        </text>
        <text x="688" y="962" font-size="13" fill="#c56313">
            best-effort — PostgreSQL is the source of truth
        </text>

        <!-- SessionRepository -->
        <rect x="1040" y="856" width="380" height="132" rx="16" fill="#fdeee0" stroke="#ec7211" stroke-width="1.5" />
        <rect x="1064" y="892" width="56" height="56" rx="12" fill="#ec7211" />
        <use href="#icon-server" x="1071" y="899" width="42" height="42" />
        <text x="1138" y="917" font-size="19" font-weight="600" fill="#a85510">
            SessionRepository
        </text>
        <text x="1138" y="943" font-size="13" fill="#c56313">
            Refresh-token hash, role, TTL — 7 days
        </text>
        <text x="1138" y="962" font-size="13" fill="#c56313">
            hard dependency: auth fails if unreachable
        </text>

        <!-- PostgreSQL -->
        <rect x="140" y="1030" width="380" height="110" rx="16" fill="#f5f0ff" stroke="#8c4fff" stroke-width="1.5" />
        <rect x="164" y="1058" width="54" height="54" rx="12" fill="#8c4fff" />
        <use href="#icon-db" x="171" y="1065" width="40" height="40" />
        <text x="236" y="1084" font-size="20" font-weight="600" fill="#5a35a8">
            PostgreSQL
        </text>
        <text x="236" y="1108" font-size="14" fill="#7856c9">users table (id, role, ...)</text>

        <!-- Redis -->
        <rect x="590" y="1030" width="830" height="110" rx="16" fill="#fdeceb" stroke="#d6423a" stroke-width="1.5" />
        <rect x="614" y="1058" width="54" height="54" rx="12" fill="#d6423a" />
        <use href="#icon-db" x="621" y="1065" width="40" height="40" />
        <text x="686" y="1084" font-size="20" font-weight="600" fill="#a52a23">
            Redis
        </text>
        <text x="686" y="1108" font-size="14" fill="#b8433b">
            two logical stores, one instance: profile cache + session store
        </text>

        <line x1="330" y1="988" x2="330" y2="1030" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)" />
        <path d="M780,988 V1030" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />
        <path d="M1230,988 V1010 H1000 V1030" stroke="#555" stroke-width="1.8" fill="none"
            marker-end="url(#arrow)" />

        <!-- Response: both data-store paths converge on one outcome -->
        <path d="M330,1140 V1220 H800" stroke="#555" stroke-width="1.8" fill="none" />
        <path d="M1005,1140 V1220 H800" stroke="#555" stroke-width="1.8" fill="none" />
        <path d="M800,1220 V1290" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrow)" />

        <rect x="588" y="1290" width="424" height="103" rx="20" fill="#e6f4ea" stroke="#1d8a4c" stroke-width="1.5" />
        <rect x="612" y="1316" width="52" height="52" rx="12" fill="#1d8a4c" />
        <use href="#icon-check" x="620" y="1324" width="36" height="36" />
        <text x="680" y="1342" font-size="20" font-weight="600" fill="#12572f">
            Response returned
        </text>
        <text x="680" y="1364" font-size="14" fill="#286b3f">
            200/201/204 success · 400–409/429 on error
        </text>

        <!-- ============ LEFT: LEGEND ============ -->
        <rect x="40" y="329" width="470" height="222" rx="12" fill="#fffdf2" stroke="#cdbf7a" stroke-width="1.5"
            stroke-dasharray="5,4" />
        <text x="62" y="362" font-size="20" font-weight="600" fill="#8a7a2b">
            Legend
        </text>

        <rect x="62" y="380" width="30" height="30" rx="7" fill="#ec7211" />
        <use href="#icon-server" x="67" y="385" width="20" height="20" />
        <text x="102" y="400" font-size="15" fill="#222">
            Express / Node.js layer
        </text>

        <rect x="62" y="422" width="30" height="30" rx="7" fill="#8c4fff" />
        <use href="#icon-db" x="67" y="427" width="20" height="20" />
        <text x="102" y="442" font-size="15" fill="#222">
            PostgreSQL data store
        </text>

        <rect x="62" y="464" width="30" height="30" rx="7" fill="#d6423a" />
        <use href="#icon-db" x="67" y="469" width="20" height="20" />
        <text x="102" y="484" font-size="15" fill="#222">
            Redis — sessions + cache
        </text>

        <rect x="280" y="380" width="30" height="30" rx="7" fill="#2e73b8" />
        <use href="#icon-key" x="285" y="385" width="20" height="20" />
        <text x="320" y="400" font-size="15" fill="#222">
            Bearer JWT auth (access + refresh)
        </text>

        <rect x="280" y="422" width="30" height="30" rx="7" fill="#1d8a4c" />
        <use href="#icon-check" x="285" y="427" width="20" height="20" />
        <text x="320" y="442" font-size="15" fill="#222">Success outcome</text>

        <rect x="280" y="464" width="30" height="30" rx="7" fill="#c98a0f" />
        <use href="#icon-warn" x="285" y="469" width="20" height="20" />
        <text x="320" y="484" font-size="15" fill="#222">Rejected outcome</text>

        <!-- ============ RIGHT COLUMN: REQUEST / RESPONSE / OBSERVABILITY ============ -->

        <rect x="1130" y="329" width="430" height="220" rx="10" fill="#f5f2ff" stroke="#8c4fff" stroke-width="1.3"
            stroke-dasharray="4,4" />
        <text x="1150" y="356" font-size="16" font-weight="600" fill="#5a35a8">
            Example — login
        </text>
        <text x="1150" y="380" font-size="14" fill="#333">
            POST /v1/login { username, password }
        </text>
        <text x="1150" y="404" font-size="14" fill="#333">
            200 { accessToken, refreshToken, user }
        </text>
        <text x="1150" y="424" font-size="12" fill="#5a35a8">
            access token: 15 min JWT (iss/aud, HS256)
        </text>
        <text x="1150" y="442" font-size="12" fill="#5a35a8">
            refresh token: opaque, 7 days, rotated on use
        </text>
        <text x="1150" y="460" font-size="12" fill="#5a35a8">
            POST /v1/auth/refresh and /v1/auth/logout manage the session
        </text>
        <text x="1150" y="478" font-size="12" fill="#5a35a8">
            GET /v1/admin/users needs role: "admin" on the token
        </text>

        <rect x="1130" y="579" width="430" height="160" rx="10" fill="#eef5fc" stroke="#4a7fd6" stroke-width="1.5"
            stroke-dasharray="5,4" />
        <text x="1150" y="608" font-size="18" font-weight="600" fill="#2e5fa3">
            Observability
        </text>

        <rect x="1150" y="624" width="34" height="34" rx="8" fill="#2e73b8" />
        <use href="#icon-chart" x="1155" y="629" width="24" height="24" />
        <text x="1196" y="642" font-size="15" fill="#222">
            GET /metrics — Prometheus
        </text>
        <text x="1196" y="662" font-size="13" fill="#555">
            http_request_duration_seconds · default Node.js metrics
        </text>

        <rect x="1150" y="686" width="34" height="34" rx="8" fill="#465a69" />
        <use href="#icon-server" x="1155" y="691" width="24" height="24" />
        <text x="1196" y="704" font-size="15" fill="#222">
            Structured JSON logs (pino)
        </text>
        <text x="1196" y="722" font-size="13" fill="#555">
            requestId correlates every log line to a request
        </text>

        <!-- Metrics, health & infra endpoints — its own row, well below
             the primary spine so nothing above can ever overlap it -->
        <rect x="330" y="1430" width="940" height="110" rx="16" fill="#eef5fc" stroke="#2e73b8" stroke-width="1.5" />
        <text x="350" y="1459" font-size="20" font-weight="600" fill="#2e5fa3">
            Infra endpoints — unversioned, outside /v1
        </text>

        <text x="350" y="1490" font-size="14" fill="#222">
            GET /health — liveness, no dependency checks
        </text>
        <text x="350" y="1512" font-size="14" fill="#222">
            GET /ready — readiness: checks PostgreSQL + Redis (2s timeout each)
        </text>
        <text x="820" y="1490" font-size="14" fill="#222">
            GET /metrics — Prometheus text format
        </text>
        <text x="820" y="1512" font-size="14" fill="#222">
            /ready and /metrics share a 60 req/min per-IP limiter
        </text>

        <!-- footer -->
        <text x="40" y="1550" font-size="14" fill="#999">
            High-level view — the big pieces and how a request flows between them.
            See README.md and docs/ for detailed diagrams.
        </text>
    </svg>